<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台語百樣人大挑戰</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://tauhu.tw/tauhu-oo.css" rel="stylesheet">
<style>
:root {
  --primary: #111111;
  --primary-light: #fff6d6;
  --accent: #ffcc00;
  --bg: #ffffff;
  --text: #111111;
  --card-bg: #ffffff;
  --correct: #1b7a34;
  --correct-bg: #e6f4ea;
  --wrong: #c62828;
  --wrong-bg: #fdeaea;
  --border: #111111;
  --border-soft: #d8d8d8;
}
* { box-sizing: border-box; font-family: tauhu-oo, 'Noto Sans TC', sans-serif; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); }
.app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; }

.hero-banner {
  width: 100%;
  background: var(--primary);
  color: var(--accent); padding: 16px 20px; text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  border-bottom: 6px solid var(--accent);
  line-height: 0;
}
.hero-banner.hidden { display: none; }
.hero-banner h1 { margin: 0; font-size: 2rem; font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
.hero-banner .subtitle { margin-top: 8px; font-size: 1rem; color: #ffffff; line-height: 1; }

.screen { width: 100%; max-width: 640px; padding: 30px 20px 60px; }
.screen.hidden { display: none; }

.count-label { font-weight: 800; color: var(--primary); margin-bottom: 12px; text-align: center; font-size: 1.05rem; }
.count-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 26px; }
.count-btn {
  background: white; border: 2px solid var(--primary); border-radius: 14px;
  padding: 18px 10px; text-align: center; font-weight: 800; font-size: 1.1rem;
  color: var(--primary); cursor: pointer; transition: all .15s ease;
}
.count-btn:hover { border-color: var(--accent); background: var(--primary-light); }
.count-btn.selected { background: var(--primary); color: var(--accent); border-color: var(--primary); transform: scale(1.03); }
.count-btn .count-sub { display: block; font-size: 0.72rem; font-weight: 500; margin-top: 4px; opacity: 0.8; }

.start-btn {
  display: block; width: 100%; background: var(--accent); color: var(--primary); border: 2px solid var(--primary);
  padding: 16px; border-radius: 28px; font-weight: 900; font-size: 1.15rem; cursor: pointer;
  box-shadow: 0 4px 14px rgba(0,0,0,0.2); transition: opacity .15s ease, transform .15s ease;
}
.start-btn:disabled { background: #eeeeee; color: #999; border-color: var(--border-soft); box-shadow: none; cursor: not-allowed; opacity: 0.8; }
.start-btn:not(:disabled):hover { transform: translateY(-1px); }

.last-score {
  text-align: center; margin-top: 22px; padding: 12px 16px; border-radius: 12px;
  background: var(--primary-light); color: var(--primary); font-weight: 800; display: none;
  border: 2px solid var(--accent);
}
.last-score.show { display: block; }

.rules-box { margin-top: 30px; background: white; border: 2px solid var(--primary); border-radius: 12px; padding: 16px 18px; font-size: 0.85rem; color: #333; }
.rules-box li { margin-bottom: 6px; }

/* --- 遊戲畫面 --- */
.game-header {
  text-align: center; color: #888888; font-weight: 700;
  margin-bottom: 10px;
  font-size: clamp(0.7rem, 2.6vw, 1.05rem);
}
.progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; font-weight: 800; color: var(--primary); }
.progress-bar-track { background: #eeeeee; border-radius: 10px; height: 8px; overflow: hidden; margin-bottom: 26px; border: 1px solid var(--primary); }
.progress-bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width .3s ease; }

.question-card { background: white; border: 2px solid var(--primary); border-radius: 16px; padding: 26px 22px; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
.qa-left, .qa-right { min-width: 0; }
.tailo-word {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  font-size: 2rem; font-weight: 900; color: var(--primary);
  padding: 6px 18px; border-radius: 14px; background: var(--primary-light);
  margin-bottom: 26px; border: 2px solid var(--accent);
}
.tailo-word:hover { background: var(--accent); }
.tailo-word .spk { font-size: 1.4rem; }
.word-stack { display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
.hanji-text { font-size: 1em; font-weight: 900; }
.tailo-text { font-size: 0.42em; font-weight: 700; opacity: 0.85; margin-top: 4px; }

.opt-list { display: flex; flex-direction: column; gap: 12px; }
@media (orientation: portrait) {
  .opt-list { display: flex; flex-direction: column; gap: 12px; }
}
.opt-btn {
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: white; border: 2px solid var(--primary); border-radius: 12px;
  padding: 14px 16px; font-size: 1rem; cursor: pointer; color: var(--text);
}
.opt-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--accent); }
.opt-letter {
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: var(--primary);
  color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 900;
}
.opt-btn.correct { background: var(--correct-bg); border-color: var(--correct); }
.opt-btn.correct .opt-letter { background: var(--correct); color: white; }
.opt-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong); }
.opt-btn.wrong .opt-letter { background: var(--wrong); color: white; }
.opt-btn:disabled { cursor: default; }

.feedback-banner {
  margin-top: 18px; text-align: center; font-weight: 900; font-size: 1.1rem; min-height: 28px;
}
.explain-box {
  display: none; margin-top: 10px; text-align: left; background: var(--primary-light);
  border: 2px solid var(--accent); border-radius: 10px; padding: 12px 16px; font-size: 0.9rem; color: #333;
}
.explain-box.show { display: block; }
.explain-box .explain-title { font-weight: 900; color: var(--primary); margin-bottom: 4px; }

.nav-row { display: flex; gap: 12px; margin-top: 22px; }
.nav-btn {
  flex: 1 1 0; background: white; color: var(--primary); border: 2px solid var(--primary);
  padding: 13px; border-radius: 24px; font-weight: 800; font-size: 1rem; cursor: pointer;
}
.nav-btn:hover:not(:disabled) { background: var(--primary-light); }
.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.nav-btn.primary { background: var(--primary); color: var(--accent); }
.nav-btn.primary:hover:not(:disabled) { background: #000; }

/* 橫式螢幕：左（詞卡＋選項）右（對錯提示＋釋義）雙欄配置。
   寬度盡量撐滿畫面（減少四周留白），字體與間距改用 clamp() 依螢幕可視範圍（vh／vw）
   等比例縮放——螢幕越大物件跟字就越大，螢幕越窄矮就自動縮小，確保不需捲動。
   此區塊放在樣式表最後，確保能覆蓋掉前面同層級選擇器的預設值。 */
@media (orientation: landscape) {
  .app { justify-content: center; }
  .screen { max-width: min(96vw, 1600px); padding: clamp(3px, 1vh, 12px) clamp(12px, 2vw, 30px) clamp(4px, 1vh, 12px); }
  .game-header { font-size: clamp(0.65rem, 2.2vh, 1rem); margin-bottom: clamp(2px, 0.6vh, 8px); }
  .progress-row { margin-bottom: clamp(2px, 0.6vh, 8px); font-size: clamp(1.6rem, 4.8vh, 2.3rem); }
  .progress-bar-track { margin-bottom: clamp(4px, 1vh, 12px); height: clamp(5px, 1vh, 10px); }

  .question-card {
    padding: clamp(8px, 1.8vh, 24px) clamp(18px, 3vw, 44px) clamp(6px, 1.4vh, 16px);
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    grid-template-areas: "left right" "nav nav";
    column-gap: clamp(20px, 3.5vw, 56px);
    row-gap: clamp(3px, 1vh, 10px);
    align-items: start;
  }
  .qa-left { grid-area: left; text-align: center; }
  .qa-right { grid-area: right; text-align: left; display: flex; flex-direction: column; justify-content: center; min-height: 100%; }
  .nav-row { grid-area: nav; margin-top: clamp(3px, 0.8vh, 10px); gap: clamp(10px, 1.6vw, 20px); }

  /* 所有文字放大一倍：font-size 的 clamp 上下限與 vh 係數皆為原本的 2 倍；
     其餘留白／間距則進一步壓縮，換取字體加倍後仍可完整顯示、不需捲動的空間。 */
  .tailo-word {
    font-size: clamp(3rem, 11vh, 5.6rem);
    padding: clamp(3px, 1vh, 12px) clamp(18px, 2.8vw, 38px);
    margin-bottom: clamp(5px, 1.4vh, 16px);
  }
  .tailo-word .spk { font-size: clamp(2.2rem, 6.4vh, 3.4rem); }

  .opt-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(5px, 1.2vh, 14px); }
  .opt-btn { padding: clamp(5px, 1.4vh, 16px) clamp(12px, 1.6vw, 24px); font-size: clamp(1.7rem, 4.2vh, 2.4rem); gap: clamp(10px, 1.4vw, 18px); }
  .opt-letter { width: clamp(36px, 7vh, 66px); height: clamp(36px, 7vh, 66px); font-size: clamp(1.5rem, 3.4vh, 2rem); }

  .feedback-banner { margin-top: 0; font-size: clamp(1.9rem, 5vh, 2.8rem); min-height: auto; text-align: left; }
  .explain-box { margin-top: clamp(2px, 0.8vh, 10px); padding: clamp(5px, 1.2vh, 14px) clamp(12px, 1.6vw, 22px); font-size: clamp(1.4rem, 3.6vh, 2.1rem); }
  .explain-box .explain-title { font-size: clamp(1.6rem, 4vh, 2.2rem); margin-bottom: clamp(1px, 0.4vh, 5px); }

  .nav-btn { padding: clamp(5px, 1.2vh, 16px); font-size: clamp(1.76rem, 4vh, 2.3rem); }
}

@media (orientation: landscape) and (max-height: 460px) {
  .explain-box { max-height: 30vh; overflow-y: auto; padding: 4px 10px; margin-top: 2px; }
  .game-header { font-size: 0.6rem; margin-bottom: 2px; }
  .screen { padding-top: 2px; padding-bottom: 4px; }
  .progress-row { margin-bottom: 2px; }
  .progress-bar-track { margin-bottom: 3px; }
  .question-card { padding: 4px 18px 4px; row-gap: 2px; }
  .tailo-word { margin-bottom: 3px; padding: 2px 14px; }
  .opt-list { gap: 3px; }
  .opt-btn { padding: 3px 10px; }
  .nav-row { margin-top: 2px; }
  .nav-btn { padding: 3px; }
}

/* 直式螢幕：遊戲頁面內物件間距整體縮小，把空間留給題卡本身。
   只作用在遊戲頁面（#screen-game），不影響入口頁的版面。 */
@media (orientation: portrait) {
  #screen-game { padding: 14px 16px 20px; }
  #screen-game .game-header { font-size: clamp(0.7rem, 3.6vw, 0.95rem); margin-bottom: 8px; }
  #screen-game .progress-row { margin-bottom: 8px; }
  #screen-game .progress-bar-track { margin-bottom: 12px; }
  #screen-game .question-card { padding: 16px 16px; display: flex; flex-direction: column; }
  #screen-game .tailo-word { margin-bottom: 14px; }
  #screen-game .opt-list { gap: 8px; }
  /* 「上一題」「下一題」移到「選項」與「對錯提示／釋義」之間 */
  #screen-game .nav-row { order: 2; margin: 14px 0; gap: 10px; }
  #screen-game .qa-right { order: 3; }
  #screen-game .feedback-banner { margin-top: 0; min-height: 20px; }
  #screen-game .explain-box { margin-top: 6px; padding: 10px 14px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="hero-banner" id="hero-banner">
    <h1>台語百樣人大挑戰</h1>
    <div class="subtitle">臺中明道中學 詹宗龍 製作</div>
  </div>

  <div class="screen" id="screen-entry">
    <div class="count-label">請選擇題數</div>
    <div class="count-grid" id="count-grid"></div>
    <button class="start-btn" id="start-btn" disabled onclick="startChallenge()">開始挑戰</button>
    <div class="last-score" id="last-score"></div>
    <div class="rules-box">
      <ul>
        <li>🎲 題目會隨機出現，全部題號輪過一輪之後才會再重複。</li>
        <li>🔊 點擊題目中央的臺羅字詞，可以聽官方讀音。</li>
        <li>✅ 答對會有正確音效，並顯示釋義說明；❌ 答錯會有錯誤音效，可以繼續作答。</li>
        <li>⬅️➡️ 「上一題」「下一題」按鈕隨時可以使用，自由切換題目。</li>
      </ul>
    </div>
  </div>

  <div class="screen hidden" id="screen-game">
    <div class="game-header">臺中明道中學 詹宗龍 製作</div>
    <div class="progress-row">
      <span id="progress-text">第 1 / 5 題</span>
      <span id="score-text">答對 0 題</span>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div class="question-card" id="question-card">
      <div class="qa-left">
        <div class="tailo-word" id="tailo-word" onclick="playCurrentAudio()">
          <span class="word-stack">
            <span id="hanji-text" class="hanji-text"></span>
            <span id="tailo-text" class="tailo-text"></span>
          </span>
          <span class="spk">🔊</span>
        </div>
        <div class="opt-list" id="opt-list"></div>
      </div>
      <div class="qa-right">
        <div class="feedback-banner" id="feedback-banner"></div>
        <div class="explain-box" id="explain-box">
          <div class="explain-title">📖 釋義</div>
          <div id="explain-text"></div>
        </div>
      </div>
      <div class="nav-row">
        <button class="nav-btn" id="prev-btn" onclick="prevQuestion()">⬅️ 上一題</button>
        <button class="nav-btn primary" id="next-btn" onclick="nextQuestion()">下一題 ➡️</button>
      </div>
    </div>
  </div>

const QUESTIONS = [{"id": 1, "term": "鴉片仙", "tailo": "a-phiàn-sian", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/11/11573.mp3", "opts": ["強悍兇狠狡詐的領袖人物。", "煙鬼、癮君子。稱呼抽鴉片成癮的人。", "指不良少年。", "買方。購買貨物的人。"], "ans": 1, "explain": "煙鬼、癮君子。稱呼抽鴉片成癮的人。"}, {"id": 2, "term": "阿舍", "tailo": "a-sià", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/4/4562.mp3", "opts": ["公子哥兒、紈褲子弟、紈褲子弟。富貴人家的子弟，浮華而不知人間疾苦。", "男子漢。有大丈夫氣概的人。", "等候補位。 等候補位的人。", "侵害、干擾、沖撞。 牴觸、違背。 犯人。"], "ans": 0, "explain": "公子哥兒、紈褲子弟、紈褲子弟。富貴人家的子弟，浮華而不知人間疾苦。"}, {"id": 3, "term": "阿舍囝", "tailo": "a-sià-kiánn", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/4/4563.mp3", "opts": ["紈褲子弟、公子哥兒。不事生產的有錢人家子弟。", "有孝行的女孩子。 居父母喪的女子。", "勇將。勇猛的戰將，常用來稱讚某人很有魄力等。", "漂亮的女子。"], "ans": 0, "explain": "紈褲子弟、公子哥兒。不事生產的有錢人家子弟。"}, {"id": 4, "term": "阿啄仔", "tailo": "a-tok-á", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/4/4601.mp3", "opts": ["女人、女性、女生。", "指胸肌發達、腰圍收束的腰。一般用來形容男人。", "年輕未婚的女孩子。", "老外、洋人。因為洋人的鼻子高挺，所以用「啄」(tok)來代稱洋人。有歧視意味，應避免使用。"], "ans": 3, "explain": "老外、洋人。因為洋人的鼻子高挺，所以用「啄」(tok)來代稱洋人。有歧視意味，應避免使用。"}, {"id": 5, "term": "紅嬰仔", "tailo": "âng-enn-á/âng-inn-á", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/5/5434.mp3", "opts": ["母老虎。指凶悍的女人。 菊科鬼針草屬，是一種民間的藥草。果實上長有刺毛，易附著於人的衣物或動物身上藉以散布、繁衍。", "男性與女性。", "嬰兒。指新生的幼兒，因為全身紅紅的，所以得名。", "成年人。"], "ans": 2, "explain": "嬰兒。指新生的幼兒，因為全身紅紅的，所以得名。"}, {"id": 6, "term": "漚客", "tailo": "àu-kheh", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/10/10622.mp3", "opts": ["不同的性別。", "無家可歸的流浪漢。", "惡客、差勁的客人。指只看不買，又愛挑三撿四、嫌東嫌西的客人。", "男性與女性。"], "ans": 2, "explain": "惡客、差勁的客人。指只看不買，又愛挑三撿四、嫌東嫌西的客人。"}, {"id": 7, "term": "䆀手", "tailo": "bái-tshiú", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/13/13518.mp3", "opts": ["有孝行的女孩子。 居父母喪的女子。", "左手。", "婚姻介紹人。", "侍奉父母能善盡孝道的人。"], "ans": 1, "explain": "左手。"}, {"id": 8, "term": "買主", "tailo": "bé-tsú/bué-tsú", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/9/9051.mp3", "opts": ["手下、下屬。從事打雜工作的部屬。", "男子所流露出的好色神情。", "女人。 太太、妻子。", "買方。購買貨物的人。"], "ans": 3, "explain": "買方。購買貨物的人。"}, {"id": 9, "term": "美人", "tailo": "bí-jîn/bí-lîn", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/5/5379.mp3", "opts": ["仇恨。", "指人像是緊靠牆壁行走的鬼，突然出現，使人嚇一跳。", "漂亮的女子。", "在各級學校受教育的人。 向老師或長輩學習的人謙虛自稱。"], "ans": 2, "explain": "漂亮的女子。"}, {"id": 10, "term": "猛將", "tailo": "bíng-tsiòng", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/7/7604.mp3", "opts": ["私心為己，圖謀非法利益，不顧國家利害關係的臣子。 奸險的人。 形容人陰險的性格。", "物品很好使用，容易使用。 形容人很有能力、很好差遣。", "勇將。勇猛的戰將，常用來稱讚某人很有魄力等。", "身邊、身旁。 身上、隨身。"], "ans": 2, "explain": "勇將。勇猛的戰將，常用來稱讚某人很有魄力等。"}, {"id": 11, "term": "某囝", "tailo": "bóo-kiánn", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/5/5092.mp3", "opts": ["在各級學校受教育的人。 向老師或長輩學習的人謙虛自稱。", "妻兒、妻小。妻子和兒女。 妻子。", "單身漢。", "具有高度智慧和靈性，能使用語言進行思維溝通，且能製造並使用工具的高等動物。 人家、別人。 具有某種身份或特徵的人。 借稱自己。 與人有關的事，如人的品格、個性、身體狀況等。"], "ans": 1, "explain": "妻兒、妻小。妻子和兒女。 妻子。"}, {"id": 12, "term": "某乜人", "tailo": "bóo-mí-lâng", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/5/5079.mp3", "opts": ["某人。表示不知道其姓名或不方便講明的人。", "工程圍標的主事者，有時也指得標的人。", "男性與女性。", "不良少女。"], "ans": 0, "explain": "某人。表示不知道其姓名或不方便講明的人。"}, {"id": 13, "term": "下跤手人", "tailo": "ē-kha-tshiú-lâng", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/0/483.mp3", "opts": ["來賓，相對於「主」來說。 指做生意、從事買賣的人對買主的稱呼。", "奴隸、僕人。", "手下、下屬。從事打雜工作的部屬。", "小豬。剛出生沒多久的小豬。 戲稱豬年出生的小孩。"], "ans": 2, "explain": "手下、下屬。從事打雜工作的部屬。"}, {"id": 14, "term": "下司", "tailo": "ē-si", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/0/281.mp3", "opts": ["家庭。 尊稱自己的長輩。 尊稱學有專長的人。 與家庭有關的。 表單位、商店或團體。 表派別。", "下屬、手下。", "占據山頭建立營寨或出沒山中的盜賊。", "不良少女。"], "ans": 1, "explain": "下屬、手下。"}, {"id": 15, "term": "嬰仔", "tailo": "enn-á/inn--á", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/12/12150.mp3", "opts": ["婚姻介紹人。", "嬰兒。初生的幼兒。", "仇恨。", "從原本成串的穀穗、果實中脫落的穀粒或果粒。 落隊者、脫隊者、落伍者。"], "ans": 1, "explain": "嬰兒。初生的幼兒。"}, {"id": 16, "term": "囡仔嬰", "tailo": "gín-á-enn/gín-á-inn", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/2/2153.mp3", "opts": ["在座位上的人，可用來泛指參與者或出席者。", "混血兒。 泛指婚外所生的小孩。", "嬰孩。", "鄰居。 房子的旁邊、附近。"], "ans": 2, "explain": "嬰孩。"}, {"id": 17, "term": "囡仔工", "tailo": "gín-á-kang", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/2/2145.mp3", "opts": ["形容人老了以後，兩邊臉頰鬆弛下垂如麻糬狀。", "年齡幼小的勞動者、童工。", "男子所流露出的好色神情。", "惡棍、地痞。獨霸一方的壞人。在地方上為非做歹，欺壓民眾的人。"], "ans": 1, "explain": "年齡幼小的勞動者、童工。"}, {"id": 18, "term": "囡仔栽", "tailo": "gín-á-tsai", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/2/2150.mp3", "opts": ["指還在成長中的小孩子。", "年輕力壯的小伙子。", "冤家。意見不合，立場相反的兩方。", "當擋箭牌、當墊背的、當炮灰。指在利益分配或激烈競爭過程中被犧牲的個人或組織。"], "ans": 0, "explain": "指還在成長中的小孩子。"}, {"id": 19, "term": "牛頭", "tailo": "gû-thâu", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/1/1287.mp3", "opts": ["富有的人。", "兒女。 對賢者的美稱。 對人的稱呼。 晚輩。 門生、信徒。 地支的第一位。 時辰名。用十二地支命名。 名詞後綴。", "對古板、迂腐的知識分子的蔑稱。", "牛的頭部。 陰間的差役，具有人的身體，頭部為牛的形象，專門拘提在陽間做惡的人。 放牛班學生的班頭、學生領導人。聯考升學的教育年代習慣稱中學的非升學班為「放牛班」，其中常帶領同學作怪的學生就稱作「牛頭」。"], "ans": 3, "explain": "牛的頭部。 陰間的差役，具有人的身體，頭部為牛的形象，專門拘提在陽間做惡的人。 放牛班學生的班頭、學生領導人。聯考升學的教育年代習慣稱中學的非升學班為「放牛班」，其中常帶領同學作怪的學生就稱作「牛頭」。"}, {"id": 20, "term": "外人", "tailo": "guā-lâng", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/1/1416.mp3", "opts": ["侵害、干擾、沖撞。 牴觸、違背。 犯人。", "獨子。唯一的兒子。", "沒有親屬關係的人。 外面的人，範圍以外的人。", "難民。遭遇災害的人民。"], "ans": 2, "explain": "沒有親屬關係的人。 外面的人，範圍以外的人。"}, {"id": 21, "term": "海賊", "tailo": "hái-tsha̍t", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/6/6208.mp3", "opts": ["巧取豪奪、心狠如虎的商人。", "海盜。在海上掠奪、強劫財物的人。", "船隻的所有人。", "惡棍、地痞。獨霸一方的壞人。在地方上為非做歹，欺壓民眾的人。"], "ans": 1, "explain": "海盜。在海上掠奪、強劫財物的人。"}, {"id": 22, "term": "學生", "tailo": "ha̍k-sing", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/11/11618.mp3", "opts": ["待產或剛生產完的婦人。", "有孝行的女孩子。 居父母喪的女子。", "在各級學校受教育的人。 向老師或長輩學習的人謙虛自稱。", "三腳貓。形容技藝不精、不中用的人。"], "ans": 2, "explain": "在各級學校受教育的人。 向老師或長輩學習的人謙虛自稱。"}, {"id": 23, "term": "番薯仔囝", "tailo": "han-tsî-á-kiánn/han-tsû-á-kiánn", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/14/14333.mp3", "opts": ["指才能出眾、抱負遠大、膽識過人，能做出重大貢獻的人物。", "土地所有權人。", "小偷、竊盜財物的人。", "小地瓜。 臺灣人自稱。"], "ans": 3, "explain": "小地瓜。 臺灣人自稱。"}, {"id": 24, "term": "漢", "tailo": "hàn", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/10/10609.mp3", "opts": ["媒婆。替人作媒的婦女。", "婚姻介紹人。", "端莊嫻淑，既文雅又有德性的女子。", "指人的身材。 指男人。"], "ans": 3, "explain": "指人的身材。 指男人。"}, {"id": 25, "term": "孝女", "tailo": "hàu-lí/hàu-lú", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/3/3063.mp3", "opts": ["有孝行的女孩子。 居父母喪的女子。", "扒手、三隻手。專門在公共場所偷取人家財物的小偷。", "紈褲子弟、公子哥兒。不事生產的有錢人家子弟。", "品德操守低下，人格卑劣的人。"], "ans": 0, "explain": "有孝行的女孩子。 居父母喪的女子。"}, {"id": 26, "term": "孝子", "tailo": "hàu-tsú", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/3/3064.mp3", "opts": ["侍奉父母能善盡孝道的人。", "無家可歸的流浪漢。", "文人、讀書人、知識份子。", "在座位上的人，可用來泛指參與者或出席者。"], "ans": 0, "explain": "侍奉父母能善盡孝道的人。"}, {"id": 27, "term": "校友", "tailo": "hāu-iú", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/6/6097.mp3", "opts": ["工程圍標的主事者，有時也指得標的人。", "指才能出眾、抱負遠大、膽識過人，能做出重大貢獻的人物。", "學校師生稱畢業於本校的人，也可以包括曾服務於本校的教職員。 畢業於同一學校、同一院、所系之一群人。", "煙鬼、癮君子。稱呼抽鴉片成癮的人。"], "ans": 2, "explain": "學校師生稱畢業於本校的人，也可以包括曾服務於本校的教職員。 畢業於同一學校、同一院、所系之一群人。"}, {"id": 28, "term": "候補", "tailo": "hāu-póo", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/5/5763.mp3", "opts": ["冤家。意見不合，立場相反的兩方。", "窮鬼、窮光蛋。很窮的人。", "等候補位。 等候補位的人。", "在選舉前預先登記或提名做為被選舉對象的人，也指有資格獲得學術學位的人。"], "ans": 2, "explain": "等候補位。 等候補位的人。"}, {"id": 29, "term": "候選人", "tailo": "hāu-suán-jîn/hāu-suán-lîn", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/5/5774.mp3", "opts": ["在選舉前預先登記或提名做為被選舉對象的人，也指有資格獲得學術學位的人。", "不同的性別。", "本地人。居住在當地的人。", "限定的人數。"], "ans": 0, "explain": "在選舉前預先登記或提名做為被選舉對象的人，也指有資格獲得學術學位的人。"}, {"id": 30, "term": "梟雄", "tailo": "hiau-hiông", "audio": "https://sutian.moe.ed plain": "落翅仔、蹺家少女。落翅，即飛鳥因翅膀受傷墜落下來的意思。落翅仔常引申為逃家、蹺課，或以非法性交易謀生的學齡少女。"}, {"id": 82, "term": "流糍", "tailo": "lâu-tsî", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/5/5207.mp3", "opts": ["形容人老了以後，兩邊臉頰鬆弛下垂如麻糬狀。", "強悍兇狠狡詐的領袖人物。", "買方。購買貨物的人。", "當擋箭牌、當墊背的、當炮灰。指在利益分配或激烈競爭過程中被犧牲的個人或組織。"], "ans": 0, "explain": "形容人老了以後，兩邊臉頰鬆弛下垂如麻糬狀。"}, {"id": 83, "term": "老公仔", "tailo": "lāu-kong-á", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/2/2619.mp3", "opts": ["勇將。勇猛的戰將，常用來稱讚某人很有魄力等。", "端莊嫻淑，既文雅又有德性的女子。", "等候補位。 等候補位的人。", "老人、老翁。"], "ans": 3, "explain": "老人、老翁。"}, {"id": 84, "term": "老姑婆", "tailo": "lāu-koo-pô", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/2/2671.mp3", "opts": ["三腳貓。形容技藝不精、不中用的人。", "老處女。謔稱年紀大而未出嫁的女人，但有性別歧視之虞，應避免使用。", "占據山頭建立營寨或出沒山中的盜賊。", "浪蕩子。貪戀玩樂，不務正業，行為不檢點的人。"], "ans": 1, "explain": "老處女。謔稱年紀大而未出嫁的女人，但有性別歧視之虞，應避免使用。"}, {"id": 85, "term": "老芋仔", "tailo": "lāu-ōo-á", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/2/2665.mp3", "opts": ["某人。表示不知道其姓名或不方便講明的人。", "單身。還沒結婚的人。", "到商店購買東西的人。", "指隨國民政府來臺的退伍老兵，是一種蔑稱，應避免使用。"], "ans": 3, "explain": "指隨國民政府來臺的退伍老兵，是一種蔑稱，應避免使用。"}, {"id": 86, "term": "老長壽", "tailo": "lāu-tiông-siū", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/27/27407.mp3", "opts": ["女性、女子。", "狎玩娼妓的人。", "人瑞，多指有德行或高壽的人。", "指還在成長中的小孩子。"], "ans": 2, "explain": "人瑞，多指有德行或高壽的人。"}, {"id": 87, "term": "女", "tailo": "白 lí/lú", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/0/189.mp3", "opts": ["土包子、鄉巴佬。形容缺乏見識、知識的人。", "房東。出租房屋的人。", "女性、女子。", "有錢人。錢財充裕、生活富足的人。"], "ans": 2, "explain": "女性、女子。"}, {"id": 88, "term": "理事", "tailo": "lí-sū", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/7/7656.mp3", "opts": ["土包子、鄉巴佬。形容缺乏見識、知識的人。", "他人、其他的人。", "老處女。謔稱年紀大而未出嫁的女人，但有性別歧視之虞，應避免使用。", "一個公司或團體中管理事務的人。"], "ans": 3, "explain": "一個公司或團體中管理事務的人。"}, {"id": 89, "term": "羅漢跤仔", "tailo": "lô-hàn-kha-á", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/12/12 -á", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/5/5099.mp3", "opts": ["單身漢。", "房東。出租房屋的人。", "小偷、竊盜財物的人。", "對年輕女子的泛稱。"], "ans": 3, "explain": "對年輕女子的泛稱。"}, {"id": 187, "term": "查某𡢃", "tailo": "tsa-bóo-kán", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/5/5096.mp3", "opts": ["持槍射擊者。引申指冒名頂替，代人做文章或答題者。", "煙鬼、癮君子。稱呼抽鴉片成癮的人。", "婢女、丫鬟。專門聽命僱主做事的女性僕人。一般還分專門侍奉年長者的「老𡢃」(lāu kán)、伺候小姐也兼做其他瑣細工作的「幼𡢃」(iù kán)和專門做廚房伙食，洗衣打掃等笨重粗活的「粗𡢃」(tshoo kán)。", "男性與女性。"], "ans": 2, "explain": "婢女、丫鬟。專門聽命僱主做事的女性僕人。一般還分專門侍奉年長者的「老𡢃」(lāu kán)、伺候小姐也兼做其他瑣細工作的「幼𡢃」(iù kán)和專門做廚房伙食，洗衣打掃等笨重粗活的「粗𡢃」(tshoo kán)。"}, {"id": 188, "term": "查某人", "tailo": "tsa-bóo-lâng", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/5/5097.mp3", "opts": ["指人成器、像樣。常用於否定句中。 成為成年的人。 約一人高。", "鴇母、老鴇。開設妓院，蓄養小女孩成為娼妓，或誘惑控制婦女賣淫的女人。", "會首。現多指民間儲蓄互助會的發起人。", "女人。 太太、妻子。"], "ans": 3, "explain": "女人。 太太、妻子。"}, {"id": 189, "term": "查埔", "tailo": "tsa-poo", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/5/5105.mp3", "opts": ["泛指使用、消耗商品的大眾。", "經修練後長生不老、超脫塵俗的人。 對某些特定身份者的稱呼，表示尊敬。 對從事某種技藝、具有某些嗜好者的稱呼，有諷刺意味。 無論怎樣都不……。", "本地人。居住在當地的人。", "男人、男性、男生。"], "ans": 3, "explain": "男人、男性、男生。"}, {"id": 190, "term": "查埔囝", "tailo": "tsa-poo-kiánn", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/5/5107.mp3", "opts": ["前夫或前妻所留下來的小孩子。", "男子漢。有大丈夫氣概的人。", "天干的第四位，也指排序或等級為第四。 男子。 姓氏。", "奸詐、狡猾。"], "ans": 1, "explain": "男子漢。有大丈夫氣概的人。"}, {"id": 191, "term": "查埔人", "tailo": "tsa-poo-lâng", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/5/5106.mp3", "opts": ["混血兒。 泛指婚外所生的小孩。", "貪官、貪官汙吏。", "用暴力搶奪他人財物的賊匪。", "男人。 丈夫、老公。"], "ans": 3, "explain": "男人。 丈夫、老公。"}, {"id": 192, "term": "災民", "tailo": "tsai-bîn", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/3/3354.mp3", "opts": ["前面經手的人。", "男人。 丈夫、老公。", "學藝未精的技術人員或學徒。", "難民。遭遇災害的人民。"], "ans": 3, "explain": "難民。遭遇災害的人民。"}, {"id": 193, "term": "財神爺", "tailo": "tsâi-sîn-iâ", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/6/6741.mp3", "opts": ["民間傳說中掌管錢財的神，後用來戲稱掌管錢財或能給人錢財的人。", "勇將。勇猛的戰將，常用來稱讚某人很有魄力等。", "稱懷有專門技藝的人。", "男子漢。勇敢、有志氣、有擔當的男子。"], "ans": 0, "explain": "民間傳說中掌管錢財的神，後用來戲稱掌管錢財或能給人錢財的人。"}, {"id": 194, "term": "在室的", "tailo": "tsāi-sik--ê", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/13/13996.mp3", "opts": ["小弟、手下。稱呼團體中位階較低者，是比較俚俗的用法。 弟弟。表示自己的親弟弟，或至交兄弟。", "冤家。意見不合，立場相反的兩方。", "侍奉父母能善盡孝道的人。", "處女、閨女、處男。 沒有性經驗的。"], "ans": 3, "explain": "處女、閨女、處男。 沒有性經驗的。"}, {"id": 195, "term": "在室男", "tailo": "tsāi-sik-lâm", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/27/27458.mp3", "opts": ["老闆、僱主。 丈夫、先生。", "處男。尚未結婚的男性。", "泛指張三李四。 指不三不四的人。", "前夫或前妻所留下來的小孩子。"], "ans": 1, "explain": "處男。尚未結婚的男性。"}, {"id": 196, "term": "在室女", "tailo": "tsāi-sik-lí/tsāi-sik-lú", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/2/2193.mp3", "opts": ["成群的人。", "採花賊。對女性始亂終棄的男子。", "女性、女子。", "處女、閨女。未出嫁的女子。"], "ans": 3, "explain": "處女、閨女。未出嫁的女子。"}, {"id": 197, "term": "在地人", "tailo": "tsāi-tē-lâng/tsāi-tuē-lâng", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/2/2163.mp3", "opts": ["房東。出租房屋的人。", "小豬。剛出生沒多久的小豬。 戲稱豬年出生的小孩。", "指隨國民政府來臺的退伍老兵，是一種蔑稱，應避免使用。", "本地人。居住在當地的人。"], "ans": 3, "explain": "本地人。居住在當地的人。"}, {"id": 198, "term": "在座", "tailo": "tsāi-tsō", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/2/2201.mp3", "opts": ["勇將。勇猛的戰將，常用來稱讚某人很有魄力等。", "陌生人。完全不認識的人。", "在座位上的人，可用來泛指參與者或出席者。", "鄉下人。指居住在鄉村的人。"], "ans": 2, "explain": "在座位上的人，可用來泛指參與者或出席者。"}, {"id": 199, "term": "十一哥", "tailo": "tsa̍p-it-ko", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/0/59.mp3", "opts": ["難民。遭遇災害的人民。", "指人的身材。 指男人。", "在皇宮中服侍帝王后妃的女子。", "單身漢。"], "ans": 3, "explain": "單身漢。"}, {"id": 200, "term": "雜種仔囝", "tailo": "tsa̍p-tsíng-á-kiánn", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/12/12721.mp3", "opts": ["嬰兒、幼兒。", "混血兒。 泛指婚外所生的小孩。", "指事物外在的一面。 指姑母、舅舅、姨母方面的親戚。 榜樣、模範。 宣佈，顯示。 發散。", "能力足以相抗衡的對手。"], "ans": 1, "explain": "混血兒。 泛指婚外所生的小孩。"}, {"id": 201, "term": "走狗", "tailo": "tsáu-káu", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/3/3435.mp3", "opts": ["老處女。謔稱年紀大而未出嫁的女人，但有性別歧視之虞，應避免使用。", "受人差使而協助作惡的人。", "小偷、竊賊。", "嬰兒。初生的幼兒。"], "ans": 1, "explain": "受人差使而協助作惡的人。"}, {"id": 202, "term": "採花蜂", "tailo": "tshái-hue-phang", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/27/27331.mp3", "opts": ["貨品的擁有人。", "笨蛋、傻瓜。指不夠精明，不通人情世故，容易被騙的人。", "父母雙亡，因而失去自家大人們養育和教育的兒童。", "採花賊。對女性始亂終棄的男子。"], "ans": 3, "explain": "採花賊。對女性始亂終棄的男子。"}, {"id": 203, "term": "田僑仔", "tailo": "tshân-kiâu-á", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/1/1993.mp3", "opts": ["家庭。 尊稱自己的長輩。 尊稱學有專長的人。 與家庭有關的。 表單位、商店或團體。 表派別。", "具有高度智慧和靈性，能使用語言進行思維溝通，且能製造並使用工具的高等動物。 與人有關的。 具有某種身份或特徵的人。", "海盜。在海上掠奪、強劫財物的人。", "擁有許多田地，靠地價暴漲而致富的土財主。"], "ans": 3, "explain": "擁有許多田地，靠地價暴漲而致富的土財主。"}, {"id": 204, "term": "賊", "tailo": "白 tsha̍t", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/10/10055.mp3", "opts": ["泛指地方上有聲望的人，或是舉止斯文有禮的人。", "小偷、竊盜財物的人。", "待產或剛生產完的婦人。", "冤家。意見不合，立場相反的兩方。"], "ans": 1, "explain": "小偷、竊盜財物的人。"}, {"id": 205, "term": "賊仔", "tailo": "tsha̍t-á", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/10/10067.mp3", "opts": ["到商店購買東西的人。", "不良少女。", "小偷、竊賊。", "工程圍標的主事者，有時也指得標的人。"], "ans": 2, "explain": "小偷、竊賊。"}, {"id": 206, "term": "草地人", "tailo": "tsháu-tē-lâng/tsháu-tuē-lâng", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/6/6556.mp3", "opts": ["清代對未歸化臺灣原住民的稱呼，與熟番、平埔族相對應。 形容蠻橫不講理的人，但有歧視原住民之義，應避免使用。", "船上除船長以外的所有工作人員。", "鄉下人、村夫。指住在鄉下的人。", "部屬、屬下。軍隊或團體裡被統率的人。"], "ans": 2, "explain": "鄉下人、村夫。指住在鄉下的人。"}, {"id": 207, "term": "生番", "tailo": "tshenn-huan/tshinn-huan", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/1/1963.mp3", "opts": ["牛的頭部。 陰間的差役，具有人的身體，頭部為牛的形象，專門拘提在陽間做惡的人。 放牛班學生的班頭、學生領導人。聯考升學的教育年代習慣稱中學的非升學班為「放牛班」，其中常帶領同學作怪的學生就稱作「牛頭」。", "指事物外在的一面。 指姑母、舅舅、姨母方面的親戚。 榜樣、模範。 宣佈，顯示。 發散。", "清代對未歸化臺灣原住民的稱呼，與熟番、平埔族相對應。 形容蠻橫不講理的 const COUNT_OPTIONS = [
  { n: 5, label: "5 題" },
  { n: 7, label: "7 題" },
  { n: 9, label: "9 題" },
  { n: 11, label: "11 題" },
  { n: 13, label: "13 題" },
  { n: QUESTIONS.length, label: "全部" },
];
const LETTERS = ["A", "B", "C", "D"];

let selectedCount = null;
let bag = [];
let session = null; // indices, pos, correctCount, records

function buildCountGrid() {
  const grid = document.getElementById("count-grid");
  grid.innerHTML = "";
  COUNT_OPTIONS.forEach(opt => {
    const btn = document.createElement("div");
    btn.className = "count-btn";
    btn.innerHTML = opt.label + (opt.sub ? '<span class="count-sub">' + opt.sub + '</span>' : "");
    btn.onclick = () => selectCount(opt.n, btn);
    grid.appendChild(btn);
  });
}

function selectCount(n, btnEl) {
  selectedCount = n;
  document.querySelectorAll(".count-btn").forEach(b => b.classList.remove("selected"));
  btnEl.classList.add("selected");
  document.getElementById("start-btn").disabled = false;
}

// --- 不重複抽題袋：抽完所有題號才會重新洗牌 ---
function shuffledIndices() {
  const arr = QUESTIONS.map((_, i) => i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function drawQuestions(n) {
  const result = [];
  while (result.length < n) {
    if (bag.length === 0) bag = shuffledIndices();
    result.push(bag.pop());
  }
  return result;
}

function startChallenge() {
  if (!selectedCount) return;
  const indices = drawQuestions(selectedCount);
  const records = indices.map(() => ({ solved: false, wrongSet: new Set() }));
  session = { indices, pos: 0, correctCount: 0, records };
  document.getElementById("screen-entry").classList.add("hidden");
  document.getElementById("screen-game").classList.remove("hidden");
  document.getElementById("hero-banner").classList.add("hidden");
  enterQuestion();
}

// 進入一題新題目時呼叫：畫面重繪 + 自動播放該詞讀音
function enterQuestion() {
  renderQuestion();
  playCurrentAudio();
}

function currentQuestion() {
  return QUESTIONS[session.indices[session.pos]];
}

function renderQuestion() {
  const q = currentQuestion();
  const record = session.records[session.pos];
  const total = session.indices.length;
  document.getElementById("progress-text").textContent = "第 " + (session.pos + 1) + " / " + total + " 題";
  document.getElementById("score-text").textContent = "答對 " + session.correctCount + " 題";
  document.getElementById("progress-fill").style.width = Math.round(((session.pos + 1) / total) * 100) + "%";
  document.getElementById("hanji-text").textContent = q.term;
  document.getElementById("tailo-text").textContent = q.tailo;

  const optList = document.getElementById("opt-list");
  optList.innerHTML = "";
  q.opts.forEach((optText, i) => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.id = "opt-" + i;
    btn.innerHTML = '<span class="opt-letter">' + LETTERS[i] + '</span><span>' + optText.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</span>';
    btn.onclick = () => selectAnswer(i);
    if (record.wrongSet.has(i)) {
      btn.classList.add("wrong");
      btn.disabled = true;
    }
    if (record.solved && i === q.ans) {
      btn.classList.add("correct");
    }
    if (record.solved) {
      btn.disabled = true;
    }
    optList.appendChild(btn);
  });

  const feedback = document.getElementById("feedback-banner");
  const explainBox = document.getElementById("explain-box");
  if (record.solved) {
    feedback.textContent = "✅ 你著矣！";
    feedback.style.color = "var(--correct)";
    document.getElementById("explain-text").textContent = q.explain;
    explainBox.classList.add("show");
  } else if (record.wrongSet.size > 0) {
    feedback.textContent = "❌ 這毋著，繼續試看覓！";
    feedback.style.color = "var(--wrong)";
    explainBox.classList.remove("show");
  } else {
    feedback.textContent = "";
    explainBox.classList.remove("show");
  }

  document.getElementById("prev-btn").disabled = session.pos === 0;
  document.getElementById("next-btn").textContent = (session.pos === total - 1) ? "完成挑戰 🏁" : "下一題 ➡️";

  fitLandscapeCard();
}

// 橫向螢幕：題目（詞目／讀音）及選項文字可能因內容長短不一而超出可視範圍，
// 這裡量測題卡實際高度與可用視窗高度，若超出就整體等比縮小字體，直到不再溢出（或達到縮小下限）。
function fitLandscapeCard() {
  const card = document.getElementById("question-card");
  if (!card) return;

  const scalables = [
    document.getElementById("tailo-word"),
    ...Array.from(document.querySelectorAll(".opt-btn")),
    document.getElementById("feedback-banner"),
    document.getElementById("explain-box"),
    document.querySelector("#screen-game .explain-box .explain-title"),
    document.getElementById("prev-btn"),
    document.getElementById("next-btn"),
  ].filter(Boolean);

  // 先清除上一輪縮放，量測結果才會反映目前題目內容應有的原始（CSS clamp）字級。
  scalables.forEach((el) => { el.style.fontSize = ""; });
  card.style.maxHeight = "";
  card.style.overflowY = "";

  const isLandscape = window.matchMedia("(orientation: landscape)").matches;
  if (!isLandscape || !session) return;

  const bases = scalables.map((el) => parseFloat(getComputedStyle(el).fontSize) || 16);

  const screenEl = document.getElementById("screen-game");
  const header = screenEl.querySelector(".game-header");
  const progressRow = screenEl.querySelector(".progress-row");
  const progressTrack = screenEl.querySelector(".progress-bar-track");
  const screenCs = getComputedStyle(screenEl);
  const reserved =
    (header ? header.offsetHeight : 0) +
    (progressRow ? progressRow.offsetHeight : 0) +
    (progressTrack ? progressTrack.offsetHeight : 0) +
    parseFloat(screenCs.paddingTop || 0) +
    parseFloat(screenCs.paddingBottom || 0);
  const available = Math.max(120, window.innerHeight - reserved - 16);

  let scale = 1;
  let guard = 0;
  while (card.scrollHeight > available && scale > 0.28 && guard < 60) {
    scale -= 0.03;
    scalables.forEach((el, i) => { el.style.fontSize = (bases[i] * scale) + "px"; });
    guard++;
  }

  // 極端情況（內容過長，縮到下限仍放不下）：把題卡本身鎖在可視高度內，
  // 超出的部分改為卡片內部捲動，確保畫面上「看得到」的範圍一定不溢出視窗。
  card.style.maxHeight = available + "px";
  card.style.overflowY = card.scrollHeight > available ? "auto" : "visible";
}

let fitRaf = null;
window.addEventListener("resize", () => {
  if (fitRaf) cancelAnimationFrame(fitRaf);
  fitRaf = requestAnimationFrame(fitLandscapeCard);
});
window.addEventListener("orientationchange", () => {
  setTimeout(fitLandscapeCard, 200);
});

function playCurrentAudio() {
  const q = currentQuestion();
  const audio = new Audio(q.audio);
  audio.play().catch(() => {});
}

function selectAnswer(i) {
  const q = currentQuestion();
  const record = session.records[session.pos];
  if (record.solved || record.wrongSet.has(i)) return;

  const isCorrect = i === q.ans;
  const sfx = document.getElementById(isCorrect ? "sfx-correct" : "sfx-wrong");
  sfx.currentTime = 0;
  sfx.play().catch(() => {});

  if (isCorrect) {
    record.solved = true;
    session.correctCount++;
  } else {
    record.wrongSet.add(i);
  }
  renderQuestion();
}

function prevQuestion() {
  if (session.pos === 0) return;
  session.pos--;
  enterQuestion();
}

function nextQuestion() {
  const total = session.indices.length;
  if (session.pos === total - 1) {
    finishChallenge();
    return;
  }
  session.pos++;
  enterQuestion();
}

function finishChallenge() {
  const total = session.indices.length;
  const correct = session.correctCount;
  const lastScore = document.getElementById("last-score");
  lastScore.textContent = "🏆 上一輪挑戰：" + correct + " / " + total + " 題正確";
  lastScore.classList.add("show");
  session = null;
  document.getElementById("screen-game").classList.add("hidden");
  document.getElementById("screen-entry").classList.remove("hidden");
  document.getElementById("hero-banner").classList.remove("hidden");
}

buildCountGrid();
</script>
</body>
</html>
